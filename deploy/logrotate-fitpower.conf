# FitPower log rotation
/var/log/fitpower-backup.log /var/log/fitpower-health.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
}

/var/log/apache2/fitpower-*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        systemctl reload apache2 > /dev/null 2>&1 || true
    endscript
}
