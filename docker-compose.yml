services:
  php:
    build:
      context: ./api
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
        - linux/amd64
    volumes:
      - ./api:/var/www/api
    working_dir: /var/www/api
    environment:
      DB_HOST: db
      DB_NAME: fitpower
      DB_USER: fitpower
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
    networks:
      - fitpower

  db:
    image: mariadb:11
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-${DB_PASS}}
      MYSQL_DATABASE: fitpower
      MYSQL_USER: fitpower
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    # The database is NOT exposed to the host: it is reachable only from the
    # internal Docker network. Uncomment for local debugging only.
    # ports:
    #   - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitpower

  nginx:
    image: nginx:alpine
    platform: linux/arm64
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./FitPower/dist:/var/www/html:ro
      - ./api:/var/www/api:ro
      - ./api/uploads:/var/www/api/uploads
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
      - chat
      - node
    restart: unless-stopped
    networks:
      - fitpower

  chat:
    image: node:20-alpine
    platform: linux/arm64
    user: node
    working_dir: /app
    volumes:
      - ./FitPower:/app
    command: sh -c "npm install --omit=dev && node chat-server.js"
    environment:
      API_BASE_URL: http://nginx:8080
    restart: unless-stopped
    networks:
      - fitpower

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
      platforms:
        - linux/arm64
    user: node
    working_dir: /app
    volumes:
      - ./FitPower:/app
    command: sh -c "npm install && node mediasoup-server.js"
    environment:
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_IP}
      API_BASE_URL: http://nginx:8080
    restart: unless-stopped
    networks:
      - fitpower

volumes:
  db_data:

networks:
  fitpower:
